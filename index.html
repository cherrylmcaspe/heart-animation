<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Eina radaw iya</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #ffd6e7;
        }

        /* PASSWORD SCREEN */
        .password-box {
            background: white;
            padding: 35px;
            border-radius: 25px;
            text-align: center;
            width: 320px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        }

        .password-box h1 {
            margin-bottom: 10px;
            color: #ff4f81;
        }

        .password-box p {
            color: #666;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ffc0d5;
            border-radius: 12px;
            outline: none;
            text-align: center;
            font-size: 16px;
        }

        button {
            margin-top: 15px;
            padding: 12px 25px;
            border: none;
            border-radius: 20px;
            background: #ff6f9c;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #ff4f81;
        }

        #error {
            color: #e74c3c;
            margin-top: 12px;
            display: none;
        }

        /* HEART SCREEN */
        .heart-page {
            display: none;
            text-align: center;
        }

        .heart {
            font-size: 120px;
            cursor: pointer;
            animation: beat 1s infinite;
        }

        .heart-page h2 {
            color: #ff4f81;
        }

        @keyframes beat {
            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.3);
            }
        }
    </style>
</head>

<body>

    <!-- PASSWORD SCREEN -->
    <div class="password-box" id="passwordBox">

        <h1>Hi Eins</h1>

        <p>Enter Password </p>

        <input
            type="password"
            id="password"
            placeholder="Password"
        >

        <button onclick="checkPassword()">
            Open na diha 💌
        </button>

        <p id="error">
            Wrong password 😭
        </p>

    </div>


<!-- HEART PAGE -->
<div class="heart-page" id="heartPage">

    <h2>EINA</h2>

    <div class="heart">💗</div>

    <h2>REAGAN</h2>

</div>



    <script>

        function checkPassword() {

            const password = document.getElementById("password").value;

            /* CHANGE YOUR PASSWORD HERE */
            const correctPassword = "einacrushsireagan";

            if (password === correctPassword) {

                document.getElementById("passwordBox").style.display = "none";

                document.getElementById("heartPage").style.display = "block";

            } else {

                document.getElementById("error").style.display = "block";

            }
        }

    </script>

</body>
</html>
